<!DOCTYPE html>
<html>
<head>
    <title>EXTERNAL EXAMINATION</title>
<style>
body{
font-family:arial;
background-color:pink;
}
table{
background-color:white;
border-radius:8px;
box-shadow: 2px 2px 10px grey;
}
td{
padding:15px;
}
.bt{
background-color:skyblue;
}
.bt:hover{
color:blue;
}
</style>
</head>
<body>
<h2 align="center">Hotel booking form</h2>
<form align="center">
<table border="2" align="center">
<tr>
<td>Full name</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Email</td>
<td><input type="email"></td>
</tr>
<tr>
<td>Phone number</td>
<td><input type="tel"></td>
</tr>
<tr>
<td>Room type</td>
<td>
<select>
<option>Single room</option>
<option>Double room</option>
</select>
</td>
</tr>
<tr>
<td>number of guest</td>
<td><input type="number" min="1" max="10"></td>
</tr>
<tr>
<td colspan="2" align="center">
<input type="submit" value="booknow" class="bt">
</td>
</tr>
</table>
</form>
</body>
</html>
